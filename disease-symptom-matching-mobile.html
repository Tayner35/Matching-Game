<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Matching: Disease ↔ Key Symptoms</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #171923;
    --card: #1f2333;
    --accent: #6ee7ff;
    --accent2: #7cf59a;
    --text: #e6e8ef;
    --muted: #9aa0b5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    color: var(--text);
    background: linear-gradient(120deg, #0e0f13 0%, #121525 100%);
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(23,25,35,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #24283b;
    padding: 12px 14px;
  }
  h1 { margin: 0; font-size: 18px; }
  .hud { margin-top: 6px; font-size: 13px; color: var(--muted); display:flex; flex-wrap:wrap; gap:8px; }
  .hud .stat { font-variant-numeric: tabular-nums; }
  .wrap { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px; }
  .board { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .column {
    background: var(--panel);
    border: 1px solid #24283b;
    border-radius: 12px;
    padding: 10px;
  }
  .col-title {
    margin: 0 0 6px;
    padding: 8px 10px;
    font-size: 14px;
    border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, #1a1d2b, #171923);
    border: 1px solid #24283b;
  }
  .cards { display: grid; gap: 8px; }
  button.card {
    text-align: left;
    border: 1px solid #29314a;
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 14px;
    font-size: 16px;           /* larger tap target */
    line-height: 1.3;
    min-height: 48px;          /* mobile finger target */
    cursor: pointer;
    transition: transform 80ms ease, border-color 120ms ease, box-shadow 120ms ease;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    white-space: pre-wrap;     /* preserve Excel paragraph breaks */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button.card:hover { transform: translateY(-1px); border-color: #3b4568; }
  button.card.selected { outline: 2px solid var(--accent); box-shadow: 0 0 0 2px rgba(110,231,255,0.15) inset; }
  button.card.matched { opacity: .55; background: #1a202e; border-color: #2d374d; cursor: default; }
  button.card.badflash { animation: bad 400ms ease; }
  @keyframes bad {
    0% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
    100% { transform: translateX(0); }
  }
  .toolbar {
    position: sticky; bottom: 0; z-index: 15;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(23,25,35,.95);
    border-top: 1px solid #24283b;
    backdrop-filter: blur(8px);
  }
  .btn {
    padding: 12px 10px;
    border-radius: 12px;
    border: 1px solid #2c3450;
    background: linear-gradient(180deg, #242a3e, #20253a);
    color: var(--text);
    font-weight: 600;
    letter-spacing: .2px;
    cursor: pointer;
    min-height: 44px;
  }
  .footer { text-align:center; color: var(--muted); font-size: 12px; padding: 8px 0 14px; }
  /* Desktop enhancements: place stats to the right */
  @media (min-width: 900px) {
    .wrap { grid-template-columns: 1fr 280px; }
    .board { grid-template-columns: 1fr 1fr; }
    .toolbar { display:none; }
    .sidebar {
      background: var(--panel);
      border: 1px solid #24283b;
      border-radius: 12px;
      padding: 12px;
      position: sticky; top: 72px; height: fit-content;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Match Disease ↔ Key Symptoms</h1>
  <div class="hud">
    <span>Time <span id="timer" class="stat">00:00</span></span>
    <span>Best <span id="best" class="stat">—</span></span>
    <span>Score <span class="stat"><span id="score">0</span>/<span id="total">0</span></span></span>
    <span>Tries <span id="tries" class="stat">0</span></span>
    <span>Acc <span id="acc" class="stat">0%</span></span>
  </div>
</header>

<div class="wrap">
  <div class="board" id="board">
    <section class="column">
      <h2 class="col-title">Disease <span id="leftLeft"></span></h2>
      <div id="left" class="cards"></div>
    </section>
    <section class="column">
      <h2 class="col-title">Key Symptoms <span id="rightLeft"></span></h2>
      <div id="right" class="cards"></div>
    </section>
  </div>

  <aside class="sidebar" id="desktopStats" style="display:none">
    <div><strong>Time</strong> <span id="timer2" class="stat">00:00</span></div>
    <div><strong>Best</strong> <span id="best2" class="stat">—</span></div>
    <div><strong>Matches</strong> <span class="stat"><span id="score2">0</span>/<span id="total2">0</span></span></div>
    <div><strong>Attempts</strong> <span id="tries2" class="stat">0</span></div>
    <div><strong>Accuracy</strong> <span id="acc2" class="stat">0%</span></div>
    <div style="height:8px;border-radius:999px;background:#23283a;overflow:hidden;margin-top:6px;">
      <span id="accbar2" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));"></span>
    </div>
    <div style="margin-top:10px;display:grid;gap:8px;">
      <button id="start" class="btn">Start / Restart</button>
      <button id="shuffle" class="btn">Shuffle</button>
      <button id="reveal" class="btn">Reveal pairs</button>
    </div>
  </aside>
</div>

<div class="toolbar">
  <button id="start_m" class="btn">Start</button>
  <button id="shuffle_m" class="btn">Shuffle</button>
  <button id="reveal_m" class="btn">Reveal</button>
</div>

<div class="footer">Works offline. Best time and progress save in your browser.</div>

<script>
  // Data
  const PAIRS = [{"left":"Metabolic Acidosis","right":"Rapid breathing\nconfusion\nfatigue\nnausea/vomiting"},{"left":"Metabolic Alkalosis","right":"Muscle cramps\nconfusion\nparesthesias\nhypoventilation"},{"left":"Respiratory Acidosis","right":"Hypoventilation\nheadache\nconfusion\nsomnolence"},{"left":"Respiratory Alkalosis","right":"Light‑headedness\ntingling\ntetany\nseizures"},{"left":"Hereditary Orotic Aciduria","right":"Failure to thrive\ndevelopmental delay\nmegaloblastic anemia that doesn’t respond to B12/folate"},{"left":"Lesch–Nyhan Syndrome","right":"Self‑mutilation\naggressive behavior\ngouty arthritis\nchoreoathetosis\ndevelopmental delay"},{"left":"Gout","right":"Recurrent acute monoarthritis (esp. great toe)\njoint redness and swelling"},{"left":"Adenosine Deaminase Deficiency","right":"Severe combined immunodeficiency (SCID): recurrent infections\nfailure to thrive\nchronic diarrhea"},{"left":"Xeroderma Pigmentosum (XP)","right":"Severe sunburn\nfreckling\nphotosensitivity\nearly‑onset skin cancers\nkeratitis"},{"left":"Lynch Syndrome (HNPCC)","right":"Early‑onset colorectal carcinoma (often right‑sided)\nendometrial cancer; no polyps"},{"left":"Fanconi Anemia","right":"Bone‑marrow failure (pancytopenia)\nshort stature\ncafé‑au‑lait spots\nthumb/radial anomalies\ndevelopmental delay"},{"left":"Huntington’s Disease","right":"Chorea\npsychiatric changes (depression\nirritability)\ncognitive decline\nweight loss"},{"left":"Amyotrophic Lateral Sclerosis (ALS)","right":"Progressive muscle weakness\nfasciculations\nspasticity\ndysphagia; sensory normal"},{"left":"Myotonic Dystrophy","right":"Myotonia (delayed muscle relaxation)\nprogressive muscle weakness\ncataracts\ncardiac arrhythmias"},{"left":"Spinocerebellar Ataxia","right":"Progressive cerebellar ataxia\ndysarthria\neye movement abnormalities\noften neuropathy"},{"left":"Fragile X Syndrome","right":"Intellectual disability\nelongated face\nlarge ears\nmacroorchidism\nhyperactive behavior"},{"left":"Down Syndrome","right":"Intellectual disability\nflat facial profile\nepicanthal folds\nsingle palmar crease\nhypotonia\ncongenital heart disease"},{"left":"Edwards Syndrome","right":"Severe intellectual disability\nrocker‑bottom feet\nclenched fists with overlapping fingers\nmicrognathia\ncongenital heart disease"},{"left":"Patau Syndrome","right":"Cleft lip/palate\npolydactyly\nsevere intellectual disability\nmicrophthalmia\nholoprosencephaly\ncongenital heart disease"},{"left":"Turner Syndrome","right":"Short stature\nwebbed neck\nshield chest\nlymphedema at birth\nstreak ovaries → primary amenorrhea & infertility"},{"left":"Klinefelter Syndrome","right":"Tall stature\nsmall firm testes\ngynecomastia\nreduced facial/body hair\ninfertility"},{"left":"CATCH‑22 Syndrome (DiGeorge)","right":"Cleft palate\ncardiac defects (conotruncal anomalies)\nabnormal facies\nthymic aplasia → recurrent infections\nhypocalcemia (parathyroid aplasia)"},{"left":"Williams Syndrome","right":"“Elfin” facies\nextreme friendliness\nwell‑developed verbal skills\nintellectual disability\nsupravalvular aortic stenosis\nhypercalcemia\ngrowth retardation"},{"left":"Neurofibromatosis Type 1","right":"Multiple neurofibromas\ncafé‑au‑lait spots (> 6)\nLisch nodules (iris hamartomas)\naxillary freckling"},{"left":"Prader–Willi Syndrome","right":"Neonatal hypotonia\nfailure to thrive initially → hyperphagia leading to obesity\nshort stature\nintellectual disability\nsmall hands/feet\nhypogonadism"},{"left":"Angelman Syndrome","right":"Severe intellectual disability\nseizures\nataxic gait\ninappropriate laughter (“happy puppet”)\nmicrocephaly"},{"left":"CPS1 Deficiency","right":"Hyperammonemia in neonates: lethargy\nvomiting\nseizures\npoor feeding"},{"left":"OTCase Deficiency","right":"Hyperammonemia\nvomiting\npoor feeding\nlethargy\nseizures; often male infants"},{"left":"Citrullinemia (ASS deficiency)","right":"Hyperammonemia\nvomiting\nfailure to thrive; later episodes triggered by illness"},{"left":"Argininosuccinic Aciduria","right":"Hyperammonemia\nvomiting\nhepatomegaly\nbrittle hair (trichorrhexis nodosa)"},{"left":"Arginase Deficiency","right":"Progressive spasticity\ndevelopmental delay\nseizures; mild hyperammonemia"},{"left":"Sickle Cell Disease","right":"Painful vaso‑occlusive crises\nanemia\njaundice\ndactylitis\nsusceptibility to infections"},{"left":"Cystic Fibrosis","right":"Chronic cough\nrecurrent pulmonary infections (Pseudomonas)\npancreatic insufficiency → steatorrhea\nmalabsorption\ninfertility in males; failure to thrive"},{"left":"Androgen Insensitivity Syndrome (CAIS)","right":"46,XY individuals with female external genitalia\nabsent/short vagina\nscant pubic/axillary hair; primary amenorrhea"},{"left":"Maturity‑Onset Diabetes of the Young (MODY)","right":"Mild hyperglycemia in adolescence/early adulthood; often no obesity; strong family history"},{"left":"Thalassemia (α and β)","right":"Microcytic anemia\nfatigue\nsplenomegaly; severe forms: skeletal deformities\ntransfusion dependency"},{"left":"Glycosylphosphatidylinositol (GPI) Deficiency","right":"Episodic hemoglobinuria (dark urine at night)\nfatigue\nabdominal pain; thrombosis"},{"left":"Alzheimer’s Disease","right":"Progressive memory loss\ndisorientation\nbehavioral changes\nimpaired executive function"},{"left":"Progeria (Hutchinson–Gilford)","right":"Growth failure\nalopecia\nbird‑like facies\nscleroderma‑like skin\nearly cardiovascular disease"},{"left":"Systemic Lupus Erythematosus (SLE)","right":"Malar “butterfly” rash\nphotosensitivity\narthritis\nserositis\nrenal disease\nhematologic abnormalities"},{"left":"Marfan Syndrome","right":"Tall stature with long limbs\npectus deformity\nscoliosis\nhypermobile joints\nlens subluxation (upward)\naortic root dilation → aneurysm/dissection"}];
  const DATASET_ID = "4f73b101c9a4";

  // Helpers
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
  const byId = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2,'0');
  const fmt = (ms) => { const s = Math.floor(ms/1000); return pad(Math.floor(s/60))+':'+pad(s%60); };
  function shuffle(a) { for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // State
  let started=false, startTs=null, timerInt=null;
  let selectedLeft=null, selectedRight=null;
  let matches=0, tries=0, total=PAIRS.length;

  // Elements
  const timerEl = byId('timer');
  const bestEl = byId('best');
  const scoreEl = byId('score');
  const totalEl = byId('total');
  const triesEl = byId('tries');
  const accEl = byId('acc');

  // Desktop mirror stats
  const timerEl2 = byId('timer2'), bestEl2 = byId('best2'), scoreEl2 = byId('score2'), totalEl2 = byId('total2'), triesEl2 = byId('tries2'), accEl2 = byId('acc2'), accbar2 = byId('accbar2');
  function mirrorStats() {
    if (timerEl2) timerEl2.textContent = timerEl.textContent;
    if (bestEl2) bestEl2.textContent = bestEl.textContent;
    if (scoreEl2) scoreEl2.textContent = scoreEl.textContent;
    if (totalEl2) totalEl2.textContent = totalEl.textContent;
    if (triesEl2) triesEl2.textContent = triesEl.textContent;
    if (accEl2) accEl2.textContent = accEl.textContent;
  }

  function loadBest() {
    const key = 'bestTime_' + DATASET_ID;
    const v = localStorage.getItem(key);
    [bestEl, bestEl2].forEach(e => e && (e.textContent = v ? fmt(Number(v)) : '—'));
  }
  function saveBest(ms) {
    const key = 'bestTime_' + DATASET_ID;
    const v = localStorage.getItem(key);
    if (!v || ms < Number(v)) localStorage.setItem(key, String(ms));
  }

  function resetStats() {
    matches=0; tries=0;
    [scoreEl, scoreEl2].forEach(e => e && (e.textContent = matches));
    [triesEl, triesEl2].forEach(e => e && (e.textContent = tries));
    [accEl, accEl2].forEach(e => e && (e.textContent = '0%'));
    if (accbar2) accbar2.style.width = '0%';
    [totalEl, totalEl2].forEach(e => e && (e.textContent = total));
    byId('leftLeft').textContent = '';
    byId('rightLeft').textContent = '';
  }

  function tick() { const now=Date.now(); timerEl.textContent = fmt(now - startTs); mirrorStats(); }
  function startTimer() { clearInterval(timerInt); startTs=Date.now(); timerInt=setInterval(tick, 250); tick(); }
  function stopTimer() { clearInterval(timerInt); }

  function render() {
    const left = shuffle(PAIRS.map(p => p.left.slice()));
    const right = shuffle(PAIRS.map(p => p.right.slice()));
    const leftEl = byId('left'), rightEl = byId('right');
    leftEl.innerHTML=''; rightEl.innerHTML='';
    left.forEach(txt => leftEl.appendChild(makeCard('L', txt)));
    right.forEach(txt => rightEl.appendChild(makeCard('R', txt)));
    byId('leftLeft').textContent = left.length + ' cards';
    byId('rightLeft').textContent = right.length + ' cards';
    resetStats();
    started=false; timerEl.textContent='00:00'; mirrorStats();
  }

  function makeCard(side, txt) {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.textContent = txt;
    btn.setAttribute('data-side', side);
    btn.setAttribute('data-value', txt);
    btn.addEventListener('click', () => onSelect(btn));
    return btn;
  }

  function isMobile() { return window.matchMedia('(max-width: 900px)').matches; }
  function scrollToSide(side) {
    const target = side==='L' ? byId('left') : byId('right');
    if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function onSelect(btn) {
    if (btn.classList.contains('matched')) return;
    if (!started) { started=true; startTimer(); }
    const side = btn.getAttribute('data-side');
    const wasSelected = btn.classList.contains('selected');
    $$('.card.selected').forEach(b => b.classList.remove('selected'));
    if (!wasSelected) btn.classList.add('selected');
    if (side==='L') selectedLeft = wasSelected ? null : btn;
    else selectedRight = wasSelected ? null : btn;
    if (!wasSelected && isMobile()) { scrollToSide(side==='L' ? 'R' : 'L'); }
    if (selectedLeft && selectedRight) checkMatch();
  }

  function updateAccuracy() {
    const accuracy = tries ? Math.round((matches/tries)*100) : 0;
    [accEl, accEl2].forEach(e => e && (e.textContent = accuracy + '%'));
    if (accbar2) accbar2.style.width = Math.min(100, accuracy) + '%';
  }

  function checkMatch() {
    const leftVal = selectedLeft.getAttribute('data-value');
    const rightVal = selectedRight.getAttribute('data-value');
    const ok = PAIRS.some(p => p.left === leftVal && p.right === rightVal);
    tries++; [triesEl, triesEl2].forEach(e => e && (e.textContent = tries));
    updateAccuracy();
    if (ok) {
      matches++; [scoreEl, scoreEl2].forEach(e => e && (e.textContent = matches));
      [selectedLeft, selectedRight].forEach(b => { b.classList.add('matched'); b.classList.remove('selected'); b.disabled=true; });
      selectedLeft = selectedRight = null;
      if (matches===total) {
        const elapsed = Date.now() - startTs;
        stopTimer(); saveBest(elapsed); loadBest();
        setTimeout(() => alert('Round complete in ' + fmt(elapsed) + '. Attempts: ' + tries), 20);
      }
    } else {
      [selectedLeft, selectedRight].forEach(b => {
        b.classList.add('badflash');
        setTimeout(() => b.classList.remove('badflash'), 420);
      });
      setTimeout(() => {
        selectedLeft.classList.remove('selected');
        selectedRight.classList.remove('selected');
        selectedLeft = selectedRight = null;
      }, 350);
    }
  }

  function revealPairs() {
    const map = new Map(PAIRS.map(p => [p.left, p.right]));
    $$('#left .card').forEach(l => {
      const rtext = map.get(l.getAttribute('data-value'));
      if (!rtext) return;
      const r = $$('#right .card').find(x => x.getAttribute('data-value') === rtext);
      if (r) {
        l.classList.add('selected'); r.classList.add('selected');
        setTimeout(() => { l.classList.remove('selected'); r.classList.remove('selected'); }, 700);
      }
    });
  }

  function init() {
    // Show desktop sidebar only on wide screens
    if (window.matchMedia('(min-width: 900px)').matches) {
      const ds = byId('desktopStats'); if (ds) ds.style.display = 'block';
    }
    loadBest(); render();
    // Bind controls
    const bind = (id, fn) => { const el = byId(id); if (el) el.addEventListener('click', fn); };
    bind('start', render); bind('shuffle', render); bind('reveal', revealPairs);
    bind('start_m', render); bind('shuffle_m', render); bind('reveal_m', revealPairs);
  }
  init();
</script>
</body>
</html>
